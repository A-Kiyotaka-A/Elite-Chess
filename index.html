<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✧ Elite Chess ✧</title>
    <link rel="icon" href="favicon.png" type="image/png">
    
    <!-- ملف التنسيق الأساسي (الخلفية والزجاج) -->
    <link rel="stylesheet" href="style.css">
    
    <!-- ملف تنسيق الرقعة (المسار الصحيح داخل مجلد css) -->
    <link rel="stylesheet" href="css/chessboard-1.0.0.css">
</head>
<body>

    <!-- الخلفية المتحركة -->
    <video id="bg-video" autoplay muted loop playsinline>
        <source id="video-source" src="" type="video/mp4">
    </video>

    <!-- الطبقة الزجاجية اللامعة الشفافة -->
    <div class="glass-overlay"></div>

    <!-- حاوية الرقعة (هنا ستظهر الرقعة) -->
    <div id="board-container"></div>

    <!-- السكريبت الأساسي (لتشغيل الفيديو) -->
    <script src="script.js"></script>
    
    <!-- مكتبة jQuery (مطلوبة لعمل chessboard.js) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <!-- محرك قواعد الشطرنج (المسار الصحيح داخل مجلد js) -->
    <script src="js/chess.js"></script>
    
    <!-- مكتبة عرض الرقعة (المسار الصحيح داخل مجلد js) -->
    <script src="js/chessboard-1.0.0.js"></script>
    
    <!-- ملف الربط بين المحرك والرقعة -->
    <script src="init.js"></script>
</body>
</html>
