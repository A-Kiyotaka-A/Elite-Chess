<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شطرنج النُّخبة</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- الخلفية المتحركة -->
    <video id="bg-video" autoplay muted loop playsinline>
        <source id="video-source" src="" type="video/mp4">
    </video>

    <!-- الصندوق الزجاجي -->
    <div class="glass-box">
        <h1 class="main-title" data-ar="شطرنج النُّخبة" data-en="Elite Chess" data-ja="エリート・チェス">شطرنج النُّخبة</h1>
    </div>

    <!-- زر الإعدادات -->
    <button class="settings-btn" id="settings-btn">⚙</button>

    <!-- قائمة الإعدادات -->
    <div class="settings-menu" id="settings-menu">
        <div class="menu-item" id="language-btn">اللغة</div>
        
        <!-- قائمة اللغات -->
        <div class="language-menu" id="language-menu">
            <div class="lang-option" data-lang="ar">العربية</div>
            <div class="lang-option" data-lang="en">English</div>
            <div class="lang-option" data-lang="ja">日本語</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
